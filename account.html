<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Dashboard - Fidexa Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your Fidexa Bank account, view your balance, and perform secure transactions.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <header role="banner">
    <div class="encabezado">
      <div class="bloque-logo">
        <img src="images/logo.png" alt="Fidexa Bank Logo" class="logo">
      </div>
      <div class="bloque-titulo">
        <h1>Fidexa Bank</h1>
        <p class="lead">“Your trust, our innovation.”</p>
      </div>
      <nav class="bloque-nav" role="navigation" aria-label="Main navigation">
        <button onclick="window.location.href='index.html'" title="Home">🏠</button>
        <button onclick="logout()" title="Logout from your account">Logout</button>
      </nav>
    </div>
  </header>

  <main class="contenedor" role="main">
    <section aria-labelledby="overview-heading">
      <h2 id="overview-heading">Your Account Overview</h2>
      <div class="mensaje" id="userWelcome">Welcome, valued user!</div>
      <p>This section displays your balance and allows basic transactions.</p>
      <div class="mensaje" id="accountMessage" role="status" aria-live="polite"></div>
    </section>

    <section class="caja-botones" aria-label="Transaction options">
      <button class="btn-principal" onclick="createAccount()" title="Create a new account">Create Account</button>
      <button class="btn-principal" onclick="deposit()" title="Deposit funds">Deposit</button>
      <button class="btn-principal" onclick="withdraw()" title="Withdraw funds">Withdraw</button>
      <button class="btn-principal" onclick="transfer()" title="Transfer funds">Transfer</button>
      <button class="btn-principal" onclick="updateProfile()" title="Update your profile">Update Profile</button>
    </section>

    <section aria-labelledby="balance-heading">
      <h3 id="balance-heading">Available Balance:</h3>
      <div class="mensaje" id="balanceDisplay">$0.00</div>
    </section>
  </main>

  <footer role="contentinfo">
    <p>&copy; 2025 Fidexa Bank</p>
  </footer>

  <!-- Modal para entrada de datos -->
  <div id="inputModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalPromptText">
    <div class="modal-content">
      <p id="modalPromptText">Enter value:</p>
      <input type="text" id="modalInput" aria-label="Input field" />
      <div class="modal-buttons">
        <button id="modalAccept">Accept</button>
        <button id="modalCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Conexión al archivo JavaScript corregido -->
  <script src="js/logic.js"></script>
</body>
</html>
