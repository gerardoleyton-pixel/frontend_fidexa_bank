<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Fidexa Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your Fidexa Bank account to manage your finances securely and efficiently.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <header role="banner">
    <div class="encabezado">
      <div class="bloque-logo">
        <img src="images/logo.png" alt="Fidexa Bank Logo" class="logo">
      </div>

      <div class="bloque-titulo">
        <h1>Fidexa Bank</h1>
        <p class="lead">“Your trust, our innovation.”</p>
      </div>

      <nav class="bloque-nav" role="navigation" aria-label="Main navigation">
        <button onclick="window.location.href='index.html'" title="Home">🏠</button>
        <button onclick="window.location.href='register.html'" title="Register">Register</button>
        <button onclick="window.location.href='login.html'" title="Login">Login</button>
      </nav>
    </div>
  </header>

  <main class="contenedor" role="main">
    <section aria-labelledby="login-heading">
      <h2 id="login-heading">Login to Your Account</h2>

      <form id="loginForm" role="form" aria-label="User login form">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn-principal">Login</button>

        <div class="form-buttons">
          <button type="button" class="btn-secundario" onclick="window.location.href='index.html'">Cancel</button>
          <button type="button" class="btn-secundario" onclick="history.back()">Back</button>
        </div>
      </form>

      <div class="mensaje" id="loginMessage" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer role="contentinfo">
    <p>&copy; 2025 Fidexa Bank</p>
  </footer>

  <script>
    function mostrarMensaje(id, texto, tipo = "info") {
      const contenedor = document.getElementById(id);
      contenedor.textContent = texto;
      contenedor.style.color = tipo === "error" ? "#D32F2F" : "#00796B";
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        mostrarMensaje("loginMessage", "Please fill in both fields.", "error");
        return;
      }

      if (username === "admin" && password === "admin123") {
        localStorage.setItem("fidexaUser", JSON.stringify({ username: "admin", name: "Administrator", email: "admin@fidexa.com" }));
        window.location.href = "admin.html";
        return;
      }

      const userKey = "user_" + username;
      const storedUser = JSON.parse(localStorage.getItem(userKey));

      if (storedUser && storedUser.password === password) {
        localStorage.setItem("fidexaUser", JSON.stringify(storedUser));
        mostrarMensaje("loginMessage", "Login successful! Redirecting...");
        setTimeout(() => window.location.href = "account.html", 1500);
      } else {
        mostrarMensaje("loginMessage", "Incorrect credentials. Try again.", "error");
      }
    });
  </script>
</body>
</html>
