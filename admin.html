<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Fidexa Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin panel for Fidexa Bank. View and manage all registered users and bank accounts.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <header role="banner">
    <div class="encabezado">
      <div class="bloque-logo">
        <img src="images/logo.png" alt="Fidexa Bank Logo" class="logo">
      </div>

      <div class="bloque-titulo">
        <h1>Fidexa Bank</h1>
        <p class="lead">Admin Panel</p>
      </div>

      <nav class="bloque-nav" role="navigation" aria-label="Main navigation">
        <button onclick="window.location.href='index.html'" title="Go to homepage">🏠</button>
        <button onclick="window.location.href='register.html'" title="Register new user">Register</button>
        <button onclick="window.location.href='login.html'" title="Login to system">Login</button>
        <button onclick="logout()" title="Logout from admin panel">Logout</button>
      </nav>
    </div>
  </header>

  <main class="contenedor" role="main">
    <section aria-labelledby="users-heading">
      <h2 id="users-heading">All Registered Users</h2>
      <table id="userTable" class="mensaje" role="table" aria-label="List of registered users">
        <caption>Registered Users</caption>
      </table>
    </section>

    <section aria-labelledby="accounts-heading">
      <h2 id="accounts-heading">All Bank Accounts</h2>
      <table id="accountTable" class="mensaje" role="table" aria-label="List of bank accounts">
        <caption>Bank Accounts</caption>
      </table>
    </section>

    <section aria-labelledby="actions-heading">
      <h2 id="actions-heading">Admin Actions</h2>
      <button class="btn-principal" onclick="clearAll()" title="Clear all localStorage data">🧹 Clear All LocalStorage</button>
    </section>
  </main>

  <footer role="contentinfo">
    <p>&copy; 2025 Fidexa Bank</p>
  </footer>

  <script>
    function logout() {
      localStorage.removeItem("fidexaUser");
      window.location.href = "index.html";
    }

    function clearAll() {
      localStorage.clear();
      alert("All data cleared.");
      location.reload();
    }

    function deleteKey(key) {
      localStorage.removeItem(key);
      alert(`Deleted: ${key}`);
      location.reload();
    }

    function renderTables() {
      const userTable = document.getElementById("userTable");
      const accountTable = document.getElementById("accountTable");

      userTable.innerHTML = "<tr><th>Key</th><th>Username</th><th>Name</th><th>Email</th><th>Action</th></tr>";
      accountTable.innerHTML = "<tr><th>Key</th><th>Email</th><th>Balance</th><th>Action</th></tr>";

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const value = JSON.parse(localStorage.getItem(key));

        if (key.startsWith("user_")) {
          userTable.innerHTML += `
            <tr>
              <td>${key}</td>
              <td>${value.username}</td>
              <td>${value.name}</td>
              <td>${value.email}</td>
              <td><button class="btn-secundario" onclick="deleteKey('${key}')" title="Delete user ${value.username}">🗑️ Delete</button></td>
            </tr>`;
        }

        if (key.startsWith("account_")) {
          accountTable.innerHTML += `
            <tr>
              <td>${key}</td>
              <td>${key.replace("account_", "")}</td>
              <td>$${value.balance.toFixed(2)}</td>
              <td><button class="btn-secundario" onclick="deleteKey('${key}')" title="Delete account for ${key.replace("account_", "")}">🗑️ Delete</button></td>
            </tr>`;
        }
      }
    }

    renderTables();
  </script>
</body>
</html>
